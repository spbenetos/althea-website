<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Althea — Your GLP-1 Companion</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text',
                   system-ui, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #1A1D2B;
      background: #FFFFFF;
      line-height: 1.5;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
    }

    img, svg { display: block; }

    a { transition: opacity 0.15s ease; }
    a:hover { opacity: 0.85; }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
    }

    /* Smooth scroll offset for fixed nav */
    [id] {
      scroll-margin-top: 80px;
    }

    /* Responsive phone sizing */
    @media (max-width: 768px) {
      .phone-frame-wrap {
        transform: scale(0.55) !important;
      }
    }

    /* Hide nav links on mobile */
    @media (max-width: 640px) {
      nav a[href="#features"],
      nav a[href="#pricing"] {
        display: none;
      }
    }

    /* Print-friendly */
    @media print {
      nav { display: none !important; }
      section { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Components (order matters: dependencies first) -->
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="phone-screens.jsx"></script>
  <script type="text/babel" src="site-sections.jsx"></script>
  <script type="text/babel" src="site-app.jsx"></script>
</body>
</html>
