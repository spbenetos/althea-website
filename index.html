  <title>Althea — GLP-1 Tracker for Ozempic®, Wegovy®, Mounjaro®, Zepbound® & more</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Althea",
    "operatingSystem": "iOS",
    "applicationCategory": "HealthApplication",
    "description": "The companion app for your GLP-1 medication journey — dose logging, weight tracking, and side effect monitoring.",
    "url": "https://althea.team",
    "offers": { "@type": "Offer", "price": "49.99", "priceCurrency": "USD" }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      { "@type": "Question", "name": "Which medications does Althea support?", "acceptedAnswer": { "@type": "Answer", "text": "Althea supports all major GLP-1 medications — Ozempic®, Wegovy®, Mounjaro®, Zepbound®, Rybelsus®, Saxenda®, Trulicity®, Victoza®, Retatrutide and more — 16+ drugs with dosing schedules, titration steps and pharmacokinetic curves, in injectable and oral forms." } },
      { "@type": "Question", "name": "Is my health data private?", "acceptedAnswer": { "@type": "Answer", "text": "Completely. Your data lives on your device and in your own private iCloud — Althea runs no servers and never sees it. No analytics, no tracking, no ads." } },
      { "@type": "Question", "name": "Does Althea support compounded GLP-1 medications?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Alongside brand-name drugs, Althea supports compounded semaglutide and tirzepatide with custom strengths and schedules." } },
      { "@type": "Question", "name": "Does Althea replace my doctor?", "acceptedAnswer": { "@type": "Answer", "text": "No. Althea is a tracking companion, not a medical device. It helps you arrive at appointments with clear data, but every medication decision belongs with your prescribing provider." } }
    ]
  }
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text',
                   system-ui, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #0D1117;
      background: #fff;
      line-height: 1.5;
      overflow-x: hidden;
    }

    #root { min-height: 100vh; }

    a { color: #1A8A7A; transition: opacity 0.15s ease; }
    a:hover { opacity: 0.85; }
    button { font-family: inherit; }

    [id] { scroll-margin-top: 80px; }

    /* Ported from the redesign: serif display voice + keyboard focus */
    h1, h2 { font-family: 'Newsreader', Georgia, 'Times New Roman', serif !important; font-weight: 400 !important; letter-spacing: -0.02em !important; }
    :focus-visible { outline: 2px solid #1A8A7A; outline-offset: 3px; border-radius: 4px; }

    /* Prevent horizontal overflow */
    section, header, footer, nav { overflow-x: clip; }

    @media (max-width: 480px) {
      #pricing [style*="repeat(2"] {
        grid-template-columns: 1fr !important;
      }
    }

    /* Features horizontal scrollbar */
    .features-scroll::-webkit-scrollbar { height: 8px; }
    .features-scroll::-webkit-scrollbar-track { background: transparent; }
    .features-scroll::-webkit-scrollbar-thumb {
      background: rgba(42,181,162,0.28); border-radius: 20px;
      border: 2px solid #fff; background-clip: padding-box;
    }
    .features-scroll::-webkit-scrollbar-thumb:hover { background: rgba(42,181,162,0.5); background-clip: padding-box; }
    .features-scroll { scrollbar-width: thin; scrollbar-color: rgba(42,181,162,0.35) transparent; }

    /* Showcase horizontal scrollbar */
    .showcase-scroll::-webkit-scrollbar { height: 8px; }
    .showcase-scroll::-webkit-scrollbar-track { background: transparent; }
    .showcase-scroll::-webkit-scrollbar-thumb {
      background: rgba(42,181,162,0.28); border-radius: 20px;
      border: 2px solid transparent; background-clip: padding-box;
    }
    .showcase-scroll::-webkit-scrollbar-thumb:hover { background: rgba(42,181,162,0.5); background-clip: padding-box; }
    .showcase-scroll { scrollbar-width: thin; scrollbar-color: rgba(42,181,162,0.35) transparent; }

    @keyframes impactRise {
      0% { transform: translateY(28px); opacity: 0; }
      45% { opacity: 1; }
      100% { transform: translateY(-40px); opacity: 0; }
    }

    @media print {
      nav { display: none !important; }
    }
  </style>
</head>
