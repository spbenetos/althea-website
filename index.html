<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Althea — The companion app for your GLP-1 medication journey. Track doses, monitor weight, log side effects.">
  <link rel="canonical" href="https://althea.team/">
  <link rel="icon" type="image/png" href="app-icon.png">
  <link rel="apple-touch-icon" href="app-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://althea.team/">
  <meta property="og:title" content="Althea — GLP-1 Companion App">
  <meta property="og:description" content="Track every dose. See every result. Download Althea on the App Store.">
  <meta property="og:image" content="https://althea.team/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Althea — GLP-1 Companion App">
  <meta name="twitter:description" content="Track every dose. See every result.">
  <meta name="twitter:image" content="https://althea.team/og-image.png">
  <meta name="theme-color" content="#2AB5A2">
  <title>Althea — GLP-1 Medication Companion</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Althea",
    "operatingSystem": "iOS",
    "applicationCategory": "HealthApplication",
    "description": "The companion app for your GLP-1 medication journey — dose logging, weight tracking, and side effect monitoring.",
    "url": "https://althea.team",
    "offers": { "@type": "Offer", "price": "49.99", "priceCurrency": "USD" }
  }
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text',
                   system-ui, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #0D1117;
      background: #fff;
      line-height: 1.5;
      overflow-x: hidden;
    }

    #root { min-height: 100vh; }

    a { transition: opacity 0.15s ease; }
    a:hover { opacity: 0.85; }
    button { font-family: inherit; }

    [id] { scroll-margin-top: 80px; }

    /* Prevent horizontal overflow */
    section, header, footer, nav { overflow-x: clip; }

    @media (max-width: 480px) {
      #pricing [style*="repeat(2"] {
        grid-template-columns: 1fr !important;
      }
    }

    /* Features horizontal scrollbar */
    .features-scroll::-webkit-scrollbar { height: 8px; }
    .features-scroll::-webkit-scrollbar-track { background: transparent; }
    .features-scroll::-webkit-scrollbar-thumb {
      background: rgba(42,181,162,0.28); border-radius: 20px;
      border: 2px solid #fff; background-clip: padding-box;
    }
    .features-scroll::-webkit-scrollbar-thumb:hover { background: rgba(42,181,162,0.5); background-clip: padding-box; }
    .features-scroll { scrollbar-width: thin; scrollbar-color: rgba(42,181,162,0.35) transparent; }

    @keyframes impactRise {
      0% { transform: translateY(28px); opacity: 0; }
      45% { opacity: 1; }
      100% { transform: translateY(-40px); opacity: 0; }
    }

    @media print {
      nav { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Image slot (web component — load before React) -->
  <script src="image-slot.js"></script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>

  <!-- App components -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="site-anim.jsx"></script>
  <script type="text/babel" src="phone-screens.jsx"></script>
  <script type="text/babel" src="site-sections.jsx"></script>
  <script type="text/babel" src="site-extras.jsx"></script>
  <script type="text/babel" src="site-app.jsx"></script>
</body>
</html>
