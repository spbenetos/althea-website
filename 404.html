<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="app-icon.png">
  <title>Page not found — Althea</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:linear-gradient(180deg,#EDF8F6 0%,#fff 70%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#0D1117;-webkit-font-smoothing:antialiased}
    .wrap{text-align:center;padding:40px 24px;max-width:480px}
    .icon{width:72px;height:72px;border-radius:16px;margin:0 auto 28px;display:block;box-shadow:0 8px 32px rgba(0,0,0,0.12)}
    .code{font-size:15px;font-weight:700;letter-spacing:.14em;color:#2AB5A2;margin-bottom:14px}
    h1{font-size:clamp(30px,6vw,42px);font-weight:750;letter-spacing:-.03em;line-height:1.1;margin-bottom:14px}
    p{font-size:16px;line-height:1.6;color:#4A5568;margin-bottom:32px}
    a.btn{display:inline-block;background:#2AB5A2;color:#fff;font-size:15px;font-weight:600;padding:13px 28px;border-radius:12px;text-decoration:none;transition:background .15s ease}
    a.btn:hover{background:#1A8A7A}
    a{color:#2AB5A2}
  </style>
</head>
<body>
  <div class="wrap">
    <img class="icon" src="app-icon.png" alt="Althea">
    <div class="code">404</div>
    <h1>This page wandered off its dosing schedule.</h1>
    <p>The page you're looking for doesn't exist or has moved. Let's get you back on track.</p>
    <a class="btn" href="/">Back to home</a>
  </div>
</body>
</html>
